<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Work Calendar — Figma Capture</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
    }

    /* ═══════════════════════════════════════════
       QUICK CREATE MODAL CARD  (QuickCreateModal.vue)
    ═══════════════════════════════════════════ */
    .quick-modal-card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow:
        0 20px 25px -5px rgba(0,0,0,0.10),
        0 10px 10px -5px rgba(0,0,0,0.04),
        0 0 0 1px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      width: 720px;
      overflow: hidden;
    }

    /* ── Header ── */
    .quick-modal-header {
      padding: 24px 24px 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .quick-modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #404040;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .btn-close-modal {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Body ── */
    .quick-modal-body {
      padding: 20px 24px;
      flex: 1;
    }

    /* modal-form-stack + two-col (CommitteesView pattern) */
    .modal-form-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ── Footer ── */
    .quick-modal-footer {
      padding: 14px 24px;
      border-top: 1px solid #f1f5f9;
      background-color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .footer-left { display: flex; align-items: center; gap: 8px; }
    .footer-right { display: flex; align-items: center; gap: 10px; }

    /* Secondary button — "Expand Full Form" */
    .btn-secondary-action {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      font-weight: 550;
      cursor: pointer;
      font-family: inherit;
    }
    /* Primary button — "Save" */
    .btn-primary-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 18px;
      border-radius: 8px;
      border: none;
      background-color: #0B529C;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* ═══════════════════════════════════════════
       FORM-CONTROL-WRAPPER  (FormInput + FormSelect shared)
    ═══════════════════════════════════════════ */
    .form-control-wrapper {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      font-family: inherit;
    }
    .form-label {
      font-size: 12.5px;
      font-weight: 500;
      color: #404040;
      user-select: none;
      display: inline-flex;
      align-items: center;
      margin-bottom: 0;
      line-height: 1.2;
    }
    .required-asterisk {
      color: #dc2626;
      font-weight: 600;
      margin-left: 3px;
    }

    /* ── FormInput ── */
    .input-container {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .form-input {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13.5px;
      color: #404040;
      outline: none;
      font-family: inherit;
    }
    .form-input::placeholder { color: #a1a1a1; }
    .form-input:focus {
      border-color: #0B529C;
      box-shadow: 0 0 0 3px rgba(11,82,156,0.08);
    }

    /* ── FormSelect ── */
    .select-container {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .form-select {
      width: 100%;
      height: 38px;
      padding: 0 32px 0 12px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13.5px;
      color: #737373;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      font-family: inherit;
    }
    .form-select:focus {
      border-color: #0B529C;
      box-shadow: 0 0 0 3px rgba(11,82,156,0.08);
    }
    /* ChevronDown icon (FormSelect.vue — Lucide, 14px, #737373) */
    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #737373;
      pointer-events: none;
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ═══════════════════════════════════════════
       GC DATE FIELD  (CommitteesView.vue pattern)
    ═══════════════════════════════════════════ */
    .gc-date-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .gc-field-label {
      font-size: 12.5px;
      font-weight: 500;
      color: #404040;
    }
    .required-star { color: #ef4444; }
    .gc-date-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    /* Calendar icon — Lucide Calendar, size=14, class="gc-cal-icon" */
    .gc-cal-icon {
      position: absolute;
      left: 10px;
      color: #94a3b8;
      pointer-events: none;
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .gc-date-input {
      width: 100%;
      height: 38px;
      padding: 0 42px 0 32px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13.5px;
      color: #404040;
      outline: none;
      font-family: inherit;
      background: #ffffff;
    }
    .gc-date-input:focus {
      border-color: #0B529C;
      box-shadow: 0 0 0 3px rgba(11,82,156,0.08);
    }
    .gc-date-input::-webkit-calendar-picker-indicator { opacity: 0; width: 0; height: 0; }
    .gc-pill-tag {
      position: absolute;
      right: 8px;
      background-color: #f1f5f9;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
      font-family: inherit;
    }

    /* Maximize2 icon (btn-secondary-action) */
    .icon-maximize {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    /* X icon (close button) */
    .icon-x {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- ═══ QuickCreateModal wrapper ═══ -->
  <div class="quick-modal-card" id="capture-target">

    <!-- Header (QuickCreateModal.vue: .quick-modal-header) -->
    <div class="quick-modal-header">
      <h3 class="quick-modal-title">Create Work Calendar</h3>
      <button class="btn-close-modal" aria-label="Close">
        <!-- X icon (Lucide X, size=18) -->
        <svg class="icon-x" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body (QuickCreateModal.vue: .quick-modal-body) -->
    <div class="quick-modal-body">
      <div class="modal-form-stack">

        <!-- Row 1: Calendar Name + Owning Entity -->
        <div class="modal-two-col">

          <!-- FormInput: Calendar Name -->
          <div class="form-control-wrapper">
            <label class="form-label">
              Calendar Name
              <span class="required-asterisk">*</span>
            </label>
            <div class="input-container">
              <input type="text" class="form-input" />
            </div>
          </div>

          <!-- FormSelect: Owning Entity -->
          <div class="form-control-wrapper">
            <label class="form-label">Owning Entity</label>
            <div class="select-container">
              <select class="form-select">
                <option value="" disabled selected hidden>Select</option>
                <option>Haleta Addis Ababa HQ</option>
                <option>QMT Bole Branch</option>
                <option>Bahir Dar Hub</option>
                <option>Hawassa Industrial Unit</option>
                <option>Platform Template</option>
              </select>
              <!-- ChevronDown (Lucide, 14px, #737373) -->
              <svg class="select-arrow" viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>

        </div>

        <!-- Row 2: Effective From + Calendar Type -->
        <div class="modal-two-col">

          <!-- GC Date Field: Effective From (CommitteesView.vue pattern) -->
          <div class="gc-date-field">
            <label class="gc-field-label">
              Effective From <span class="required-star">*</span>
            </label>
            <div class="gc-date-input-wrap">
              <!-- Calendar icon (Lucide Calendar, size=14, class="gc-cal-icon") -->
              <svg class="gc-cal-icon" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              <input type="date" class="gc-date-input" />
              <span class="gc-pill-tag">GC</span>
            </div>
          </div>

          <!-- FormSelect: Calendar Type -->
          <div class="form-control-wrapper">
            <label class="form-label">Calendar Type</label>
            <div class="select-container">
              <select class="form-select">
                <option value="" disabled selected hidden>Select</option>
                <option>Annual</option>
                <option>Project-Based</option>
                <option>Shift-Based</option>
              </select>
              <!-- ChevronDown (Lucide, 14px, #737373) -->
              <svg class="select-arrow" viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- Footer (QuickCreateModal.vue: .quick-modal-footer) -->
    <div class="quick-modal-footer">
      <div class="footer-left">
        <!-- btn-secondary-action: "Expand Full Form" with Maximize2 icon -->
        <button class="btn-secondary-action">
          <!-- Maximize2 icon (Lucide, size=13) -->
          <svg class="icon-maximize" viewBox="0 0 24 24">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
          Expand Full Form
        </button>
      </div>
      <div class="footer-right">
        <!-- btn-primary-action: "Save" — zero icons (Rule 27) -->
        <button class="btn-primary-action">Save</button>
      </div>
    </div>

  </div>

</body>
</html>
